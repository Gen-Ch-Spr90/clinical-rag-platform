spring:
  application:
    name: clinical-rag-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/clinicalrag}
    username: ${POSTGRES_USER:raguser}
    password: ${POSTGRES_PASSWORD:change-me}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8081}

rag:
  embedding:
    provider: ${EMBEDDING_PROVIDER:mock}
    dimensions: ${EMBEDDING_DIMENSIONS:1536}
  llm:
    provider: ${LLM_PROVIDER:mock}
    max-tokens: 1024
    temperature: 0.2
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    llm-model: ${OPENAI_LLM_MODEL:gpt-4o-mini}
    timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:30}
  chunking:
    size-tokens: 500
    overlap-tokens: 50


